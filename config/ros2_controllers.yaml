# ros2_controllers.yaml
# Cấu hình cho controller_manager của Wall-E robot
#
# Cách hoạt động:
#   - joint_state_broadcaster : đọc state_interfaces từ hardware và publish /joint_states
#   - diff_drive_controller   : nhận /cmd_vel, tính toán wheel velocity và gửi
#                               velocity command đến hardware, publish /odom và /tf
#
# wheel_separation = 2 × wheel_y_offset = 2 × 0.075 = 0.150 m
# wheel_radius     = 0.033 m  (đo từ wheel.png)

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController


diff_drive_controller:
  ros__parameters:
    # ── Wheel joints ──
    left_wheel_names:  ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    # ── Geometry ──
    wheel_separation:  0.150   # m  (khoảng cách tâm-tâm hai bánh)
    wheel_radius:      0.033   # m

    # Hệ số hiệu chỉnh nếu bánh thực tế lăn không đúng lý thuyết (1.0 = không hiệu chỉnh)
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier:  1.0
    right_wheel_radius_multiplier: 1.0

    # ── Odometry ──
    odom_frame_id:   odom
    base_frame_id:   base_link
    publish_odom_tf: true

    # Phương pháp tính odometry từ encoder
    # "position" = tích phân vị trí bánh xe
    # "velocity"  = dùng trực tiếp vận tốc bánh xe
    pose_covariance_diagonal:     [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal:    [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # ── Velocity command ──
    use_stamped_vel: false   # false = nhận geometry_msgs/Twist (không có header)

    # Giới hạn vận tốc tuyến tính và góc
    linear.x.has_velocity_limits:     true
    linear.x.max_velocity:            0.5    # m/s
    linear.x.min_velocity:           -0.5    # m/s
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration:        1.0    # m/s²
    linear.x.min_acceleration:       -1.0    # m/s²

    angular.z.has_velocity_limits:     true
    angular.z.max_velocity:            2.0   # rad/s
    angular.z.min_velocity:           -2.0   # rad/s
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration:        2.0   # rad/s²
    angular.z.min_acceleration:       -2.0   # rad/s²
